<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --pad: 4px;
      --gap: 2px;
      --headerH: 28px; /* Zwiększono do 28px (standard overlay.html) */
      --rowH: 18px; 
      --bgInsetX: 16px;
      
      --fade: rgba(20, 20, 20, 0.90); /* Ujednolicono przezroczystość */
      --accent: rgba(70, 0, 0, 0.85);
      --text-gray: #aaa;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0);
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    .root {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--pad); /* Użycie zmiennej, jak w overlay.html */
      box-sizing: border-box;
      gap: 6px; /* Zwiększono gap do 6px (zastępuje margin-bottom nagłówka) */
    }

    /* Nagłówek - Stylizacja identyczna jak w overlay.html */
    .headerRow {
      height: var(--headerH);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fade);
      border-radius: 4px;
      padding: 0 4px;
      box-sizing: border-box;
      flex: 0 0 auto;
      
      /* Font styles */
      color: rgba(255,255,255,0.92);
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    }

    /* Kontener na listę kart */
    .deckList {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      overflow-y: auto;
      min-height: 0; /* Ważne dla flexboxa */
    }

    /* Pojedynczy wiersz karty */
    .cardRow {
      height: var(--rowH);
      display: flex;
      align-items: stretch;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    
    .qtyLeft {
      width: var(--rowH);
      height: var(--rowH);
      flex: 0 0 var(--rowH);
      display: grid;
      place-items: center;
      background: rgba(70, 70, 70, 0.92);
      color: rgba(245,245,245,1);
      font-weight: 900;
      font-size: clamp(10px, calc(var(--rowH) * 0.70), 18px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      user-select: none;
    }

    .qtyLeft.legendary { color: #ffa500; text-shadow: 0 0 2px black; }

    .imgWrap {
      position: relative;
      flex: 1;
      background: black;
      overflow: hidden;
    }
    .imgWrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Nazwa karty na obrazku */
    .cardName {
      position: absolute;
      left: calc(var(--rowH) + 6px);
      top: 0; bottom: 0;
      display: flex; 
      align-items: center;
      font-size: 11px;
      color: white;
      text-shadow: 0 1px 2px black;
      white-space: nowrap;
      z-index: 2;
      pointer-events: none;
    }

    /* Fallback text dla kart bez obrazka */
    .fallbackName {
      position: absolute;
      left: 22px; 
      top: 0; bottom: 0;
      display: flex; 
      align-items: center;
      font-size: 11px;
      color: white;
      text-shadow: 0 1px 2px black;
      white-space: nowrap;
      z-index: 2;
    }

    .manaOver{
      position: absolute;
      left: 0;
      top: 0;
      width: var(--rowH);
      height: var(--rowH);
      display: grid;
      place-items: center;
      z-index: 2;

      background: rgba(8, 32, 80, 0.95);
      color: rgba(160, 220, 255, 1);
      font-weight: 900;
      font-size: clamp(10px, calc(var(--rowH) * 0.70), 18px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      user-select: none;
      pointer-events: none;
    }

    /* NOWY STYL WIADOMOŚCI (ujednolicony z guess/full deck overlay) */
    .msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      font-style: italic;
      padding: 20px;
      text-align: center;
    }

    .cardTooltip{
      position: fixed;
      z-index: 999999;
      pointer-events: none;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }

    .cardTooltip.hidden{ display: none; }

    .cardTooltip img{
      display: block;
      height: clamp(158px, calc(var(--rowH) * 12.96), 403px);
      width: auto;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45));
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="root">
    <div class="headerRow">Opponent Played</div>
    <div id="deckList" class="deckList">
      <div class="msg" id="debugStatus">Waiting for JS...</div>
    </div>
  </div>

  <div id="cardTooltip" class="cardTooltip hidden">
    <img id="cardTooltipImg" alt="" />
  </div>

  <script src="./opponent_overlay_renderer.js"></script>
</body>
</html>
