<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --pad: 4px;
      --gap: 2px;
      --rowH: 18px;
      --fade: rgba(20, 20, 20, 0.90);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0);
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      color: white;
    }

    .root {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--pad);
      box-sizing: border-box;
      gap: 6px;
    }

    .headerRow {
      height: 28px;
      background: var(--fade);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    }

    .deckList {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      overflow-y: auto;
      padding-right: 2px;
    }

    .cardRow {
      height: var(--rowH);
      display: flex;
      position: relative;
      border-radius: 3px;
      overflow: hidden;
      align-items: stretch;
    }

    .qtyLeft{
      width: var(--rowH);
      height: var(--rowH);
      flex: 0 0 var(--rowH);
      display: grid;
      place-items: center;
      background: rgba(70, 70, 70, 0.92);
      color: rgba(245,245,245,1);
      font-weight: 900;
      font-size: clamp(10px, calc(var(--rowH) * 0.70), 18px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      user-select: none;
    }

    .qtyLeft.legendary { color: #ffa500; text-shadow: 0 0 2px black; }

    .imgWrap {
      flex: 1;
      position: relative;
      background: black;
      overflow: hidden;
    }

    .imgWrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cardName{
      position: absolute;
      left: calc(var(--rowH) + 6px);
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      font-size: 11px;
      color: white;
      text-shadow: 0 1px 2px black;
      white-space: nowrap;
      z-index: 2;
      pointer-events: none;
    }

    .manaOver{
      position: absolute;
      left: 0;
      top: 0;
      width: var(--rowH);
      height: var(--rowH);
      display: grid;
      place-items: center;
      z-index: 2;
      background: rgba(8, 32, 80, 0.95);
      color: rgba(160, 220, 255, 1);
      font-weight: 900;
      font-size: clamp(10px, calc(var(--rowH) * 0.70), 18px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      user-select: none;
      pointer-events: none;
    }

    /* ZMIANA: Styl identyczny jak .loadingMsg w guess_overlay */
    .msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      font-style: italic;
      padding: 20px;
      text-align: center;
    }

    .cardTooltip{
      position: fixed;
      z-index: 999999;
      pointer-events: none;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }

    .cardTooltip.hidden{ display: none; }

    .cardTooltip img{
      display: block;
      height: clamp(142px, calc(var(--rowH) * 11.7), 363px);
      width: auto;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45));
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="root">
    <div class="headerRow" id="headerTitle">FULL DECK</div>
    <div class="deckList" id="deckList">
      <div class="msg">Waiting for opponent cards...</div>
    </div>
  </div>
  
  <div id="cardTooltip" class="cardTooltip hidden">
    <img id="cardTooltipImg" alt="" />
  </div>

  <script src="./full_deck_renderer.js"></script>
</body>
</html>
